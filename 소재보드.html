<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>릴스 소재 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 토스 느낌: 회색 바탕 위 흰 카드, 큰 굵은 제목, 파란 포인트, 선 대신 면으로 구분 */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface-2: #F2F4F6;
  --surface-3: #E5E8EB;
  --ink: #191F28;
  --sub: #4E5968;
  --muted: #8B95A1;
  --line: #E5E8EB;
  --accent: #3182F6;
  --accent-press: #1B64DA;
  --accent-ink: #FFFFFF;
  --accent-tint: #E8F3FF;
  --warm: #F57800;
  --warm-tint: #FFF1E0;
  --red: #F04452;
  --st-new: #6B7684;
  --st-making: #3182F6;
  --st-posted: #03B26C;
  --st-hold: #B0B8C1;
  --toast-bg: #333D4B;
  --shadow: 0 2px 12px rgba(0, 29, 58, .06);
  --font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171C; --surface: #202027; --surface-2: #2C2C35; --surface-3: #3C3C47;
    --ink: #F2F2F5; --sub: #C3C3C6; --muted: #8E8E98; --line: #2C2C35;
    --accent: #4C94F7; --accent-press: #3182F6; --accent-ink: #FFFFFF; --accent-tint: #1E2F4A;
    --warm: #FFA24A; --warm-tint: #3A2A1A; --red: #F66570;
    --st-new: #A2A2AC; --st-making: #6AA6FA; --st-posted: #2FCB8A; --st-hold: #6D6D78;
    --toast-bg: #3C3C47; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171C; --surface: #202027; --surface-2: #2C2C35; --surface-3: #3C3C47;
  --ink: #F2F2F5; --sub: #C3C3C6; --muted: #8E8E98; --line: #2C2C35;
  --accent: #4C94F7; --accent-press: #3182F6; --accent-ink: #FFFFFF; --accent-tint: #1E2F4A;
  --warm: #FFA24A; --warm-tint: #3A2A1A; --red: #F66570;
  --st-new: #A2A2AC; --st-making: #6AA6FA; --st-posted: #2FCB8A; --st-hold: #6D6D78;
  --toast-bg: #3C3C47; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 96px;
}
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 머리말 */
header.top { display: grid; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
h1 { font-size: 28px; line-height: 1.3; margin: 0; font-weight: 700; letter-spacing: -0.03em; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--sub); }
.tally span { background: var(--surface); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow); }
.tally span b { color: var(--accent); font-weight: 700; margin-left: 2px; }

.lockrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 20px; padding: 0 4px; font-size: 14px; color: var(--muted); }
.lockbtn { border: 0; background: var(--surface); color: var(--sub); border-radius: 12px; padding: 9px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
.lockbtn.on { background: var(--accent-tint); color: var(--accent); box-shadow: none; }

/* 공통 버튼 */
.btn { border: 0; background: var(--surface-2); color: var(--sub); border-radius: 12px; padding: 10px 16px; font-size: 15px; font-weight: 600; transition: background .15s, transform .1s; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-press); }
.btn:disabled { opacity: .5; }

/* 아이디어 */
.ideas { background: var(--surface); border-radius: 20px; padding: 22px 20px; margin-bottom: 12px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.ideas-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.ideas-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.ideas-head .n { font-size: 14px; color: var(--muted); order: 3; flex-basis: 100%; }
.ideas-head .btn { margin-left: auto; white-space: nowrap; padding: 6px 12px; font-size: 14px; }
#ideas-body { display: grid; gap: 12px; }
#ideas-body[hidden] { display: none; }
.idea-actions { display: flex; justify-content: flex-end; }
.idea-actions .btn { width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 14px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.idea-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; }
.idea { padding: 14px 2px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.idea:first-child { border-top: 0; }
.idea .imeta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--muted); }
.idea .itext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; font-weight: 500; color: var(--ink); }
.idea.done .itext { color: var(--muted); text-decoration: line-through; }
.idea .ibtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.idea-list li.hint { padding: 8px 2px; }

/* 찾기 */
.tools { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 14px; margin-bottom: 28px; box-shadow: var(--shadow); }
.tools input[type=search] { width: 100%; padding: 13px 16px; border: 0; border-radius: 14px; background: var(--surface-2); font-size: 16px; }
.tools input[type=search]::placeholder { color: var(--muted); }
.fgroups { display: grid; gap: 10px; }
.fgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fgroup > .lab { width: 44px; font-size: 14px; font-weight: 600; color: var(--muted); flex: none; }
.chip { border: 0; background: var(--surface-2); color: var(--sub); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; transition: background .15s; }
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed=true] { background: var(--accent-tint); color: var(--accent); font-weight: 700; }
.fgroup select { border: 0; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 500; }

/* 날짜 묶음과 소재 카드 */
.daygroup { margin-bottom: 28px; }
.dayhead { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; padding: 0 4px; }
.dayhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.dayhead .n { font-size: 14px; color: var(--muted); }

.card { background: var(--surface); border-radius: 20px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.rowline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-right: 16px; }
.rowmain { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; text-align: left; background: none; border: 0; padding: 18px 8px 18px 18px; min-width: 0; }
.num { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); color: var(--sub); font-size: 14px; font-weight: 700; display: grid; place-items: center; }
.card.is-open .num { background: var(--accent-tint); color: var(--accent); }
.ttl { font-size: 17px; font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.metaline { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.tag { border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; line-height: 20px; }
.tag.ai { background: var(--accent-tint); color: var(--accent); }
.tag.web { background: var(--warm-tint); color: var(--warm); }
.tag.src { background: var(--surface-2); color: var(--sub); }
.tag.ref { background: transparent; box-shadow: inset 0 0 0 1px var(--surface-3); color: var(--muted); }
.stsel { border: 0; border-radius: 10px; padding: 8px 10px; background: var(--surface-2); font-size: 14px; font-weight: 700; }
.stsel[data-st=new] { color: var(--st-new); }
.stsel[data-st=making] { color: var(--st-making); background: var(--accent-tint); }
.stsel[data-st=posted] { color: var(--st-posted); }
.stsel[data-st=hold] { color: var(--st-hold); }
.stsel[data-st=excluded] { color: var(--red); }
.stsel:disabled { opacity: 1; cursor: default; }

.detail { padding: 0 18px 20px; display: grid; gap: 22px; }
.toprow { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.sec h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sec .body { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.sec li::marker { color: var(--muted); }
.sec p { margin: 0; white-space: pre-wrap; }
.sec a { color: var(--accent); text-decoration: none; font-weight: 500; }
.sec a:hover { text-decoration: underline; }
.copyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 6px; font-weight: 500; }
.copyrow:last-child { margin-bottom: 0; }
.cp { border: 0; background: var(--surface-2); color: var(--sub); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.copyrow .cp { background: var(--surface); }
.cp:hover { background: var(--surface-3); }
.cp.done { background: var(--accent); color: var(--accent-ink); }
.cp.del { color: var(--red); }
.scriptbox { background: var(--surface-2); border-radius: 14px; padding: 16px; line-height: 1.75; }
textarea.memo { width: 100%; min-height: 88px; border: 0; border-radius: 14px; padding: 14px 16px; background: var(--surface-2); resize: vertical; font-size: 16px; line-height: 1.6; }
textarea.memo::placeholder { color: var(--muted); }
textarea.memo:read-only { opacity: 1; color: var(--sub); }

.empty { text-align: center; color: var(--muted); padding: 56px 16px; background: var(--surface); border-radius: 20px; }
.empty b { display: block; color: var(--ink); margin-bottom: 6px; font-size: 18px; font-weight: 700; }

#toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); background: var(--toast-bg); color: #FFFFFF; padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 10; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

#savebar { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); box-shadow: 0 -4px 16px rgba(0, 29, 58, .08); font-size: 15px; font-weight: 600; color: var(--sub); z-index: 5; }
#savebar button { border: 0; background: var(--surface-2); color: var(--sub); border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 600; }
#savebar #savebtn { background: var(--accent); color: var(--accent-ink); padding: 12px 28px; }
#savebar button:disabled { opacity: .5; }

@media (prefers-reduced-motion: reduce) { #toast, .btn, .chip { transition: none; } .btn:active { transform: none; } }
@media (max-width: 520px) {
  body { padding-block: 24px 96px; }
  h1 { font-size: 24px; }
  .rowline { grid-template-columns: minmax(0, 1fr); padding-right: 0; }
  .stsel { margin: -6px 18px 16px 66px; justify-self: start; }
  .detail { padding: 0 16px 18px; }
  .rowmain { padding: 16px 8px 16px 16px; }
}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <h1>릴스 소재 보드</h1>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>
  <div class="lockrow"><button id="lockbtn" class="lockbtn" type="button">수정 잠금 해제</button><span id="lockmsg">보기만 가능합니다</span></div>

  <section class="ideas" aria-labelledby="ideas-h">
    <div class="ideas-head"><h2 id="ideas-h">내 소재 아이디어</h2><span class="n" id="ideas-n"></span><button id="ideas-toggle" class="btn" type="button" aria-expanded="true" aria-controls="ideas-body">접기</button></div>
    <div id="ideas-body">
      <textarea id="idea-text" class="memo" aria-label="새 아이디어" placeholder="떠오른 소재를 적어 두세요. 예) 가게 메뉴판 사진을 AI로 깔끔하게 정리하는 법"></textarea>
      <div class="idea-actions"><button id="idea-add" class="btn primary" type="button">아이디어 저장</button></div>
      <p class="hint" id="idea-hint"></p>
      <ul id="idea-list" class="idea-list"></ul>
    </div>
  </section>

  <section class="tools" aria-label="소재 찾기">
    <input type="search" id="q" placeholder="제목, 근거, 후킹, 원고에서 검색" autocomplete="off">
    <div class="fgroups">
      <div class="fgroup" id="g-cat"><span class="lab">분야</span></div>
      <div class="fgroup" id="g-src"><span class="lab">출처</span></div>
      <div class="fgroup" id="g-st"><span class="lab">상태</span></div>
      <div class="fgroup"><span class="lab">날짜</span><select id="dsel" aria-label="날짜"></select></div>
    </div>
  </section>

  <main id="list"></main>
</div>
<div id="savebar" role="region" aria-label="저장"><span id="savecount"></span><button id="savebtn" type="button">저장</button><button id="savecancel" type="button">취소</button></div>
<div id="toast" role="status"></div>

<script src="./보드데이터.js"></script>
<script>
(function () {
  var STATUS = [
    { v: "new", t: "새 소재" }, { v: "making", t: "제작 중" },
    { v: "posted", t: "올림" }, { v: "hold", t: "보류" },
    { v: "excluded", t: "제외" }
  ];
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  var docs = [];
  var open = {};
  var f = { q: "", cat: "", src: "", st: "", date: "" };
  var col = null;
  var unlocked = false;
  var loaded = false;
  var dayLimit = 14; // 필터 없을 때 한 번에 보여줄 날짜 묶음 수

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function linkify(text) {
    var frag = document.createDocumentFragment();
    var re = /https?:\/\/[^\s)>,]+/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var shown = m[0].replace(/^https?:\/\/(www\.)?/, "");
      if (shown.length > 46) shown = shown.slice(0, 46) + "…";
      frag.appendChild(el("a", { href: m[0], target: "_blank", rel: "noopener noreferrer", text: shown }));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1600);
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function copy(text, btn) {
    function done() {
      toast("복사했어요");
      if (btn) { var o = btn.textContent; btn.textContent = "복사됨"; btn.classList.add("done"); setTimeout(function () { btn.textContent = o; btn.classList.remove("done"); }, 1200); }
    }
    function fail() { toast("복사하지 못했어요. 글자를 직접 선택해 주세요"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text) ? done() : fail(); });
    } else { legacyCopy(text) ? done() : fail(); }
  }
  function cpBtn(text) { var b = el("button", { class: "cp", type: "button", text: "복사" }); b.addEventListener("click", function (e) { e.stopPropagation(); copy(text, b); }); return b; }

  function dateLabel(s) {
    var p = (s || "").split("-"); if (p.length !== 3) return s || "";
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + "월 " + (+p[2]) + "일 " + DAYS[d.getDay()] + "요일";
  }
  function stText(v) { for (var i = 0; i < STATUS.length; i++) if (STATUS[i].v === v) return STATUS[i].t; return "새 소재"; }

  function fullText(t) {
    var L = [];
    L.push(t.num + ". " + t.title + " / " + t.category);
    if (t.why && t.why.length) L.push("\n[근거]\n" + t.why.map(function (x) { return "- " + x; }).join("\n"));
    if (t.change && t.change.length) L.push("\n[바꿔야 할 부분]\n" + t.change.map(function (x) { return "- " + x; }).join("\n"));
    if (t.hooks && t.hooks.length) L.push("\n[후킹 문구]\n" + t.hooks.map(function (x, i) { return (i + 1) + ") " + x; }).join("\n"));
    if (t.second) L.push("\n[둘째 문장]\n" + t.second);
    if (t.key && t.key.length) L.push("\n[핵심 내용]\n" + t.key.map(function (x) { return "- " + x; }).join("\n"));
    if (t.covers && t.covers.length) L.push("\n[표지 문구]\n" + t.covers.join("\n"));
    if (t.dmKeyword) L.push("\n[댓글 DM 자료]\n댓글 \"" + t.dmKeyword + "\" → " + (t.dmContents || ""));
    if (t.script) L.push("\n[원고]\n" + t.script);
    if (t.caption) L.push("\n[캡션]\n" + t.caption);
    return L.join("\n");
  }

  function sec(label, bodyNode, copyText) {
    var h = el("h3", null, [el("span", { text: label })]);
    if (copyText) h.appendChild(cpBtn(copyText));
    return el("div", { class: "sec" }, [h, el("div", { class: "body" }, [bodyNode])]);
  }
  function list(items) { var u = el("ul"); items.forEach(function (x) { u.appendChild(el("li", null, [linkify(x)])); }); return u; }
  function copyRows(items) {
    var w = el("div");
    items.forEach(function (x) { w.appendChild(el("div", { class: "copyrow" }, [el("span", { text: x }), cpBtn(x)])); });
    return w;
  }

  function buildDetail(t) {
    var d = el("div", { class: "detail" });
    var top = el("div", { class: "toprow" });
    var req = t.date + " " + t.num + "번 소재 더 자세히 조사해줘.\n\n" + fullText(t);
    var b1 = el("button", { class: "btn primary", type: "button", text: "자세히 조사 요청 복사" });
    b1.addEventListener("click", function () { copy(req, b1); });
    var b2 = el("button", { class: "btn", type: "button", text: "소재 내용만 복사" });
    b2.addEventListener("click", function () { copy(fullText(t), b2); });
    top.appendChild(b1); top.appendChild(b2);
    d.appendChild(top);

    if (t.hooks && t.hooks.length) d.appendChild(sec("첫 문장 후킹", copyRows(t.hooks)));
